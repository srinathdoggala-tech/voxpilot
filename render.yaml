services:
  - type: web
    name: voxpilot-backend
    env: docker
    dockerfilePath: Dockerfile.backend
    region: oregon
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: TTS_PROVIDER
        value: openai
      - key: STT_PROVIDER
        value: whisper
